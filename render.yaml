# Render Blueprint: one free web service running the Fogmosás relay + dashboard.
# https://render.com/deploy?repo=https://github.com/ferko1979/toothbrushtimer
services:
  - type: web
    name: fogmosas-web
    runtime: docker
    rootDir: web
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Test recordings from the apps (web/README.md, "Tesztfelvételek fogadása"): set in the Render dashboard.
      - key: TEST_UPLOAD_CODE
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
