name: Android store release

# Builds signed app bundles (AAB) for Google Play. Runs by hand, and only when the upload key
# secrets exist: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS,
# RELEASE_KEY_PASSWORD (see docs/RELEASE.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        env:
          KEY_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 secret missing (docs/RELEASE.md)"; exit 1; fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Test and build signed bundles
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :brushcore:test :app:bundleRelease :wear:bundleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/out/DentHub-Brush-phone.aab"
          cp wear/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/out/DentHub-Brush-wear.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: DentHub-Brush-Play-bundles
          path: out/*.aab
          retention-days: 30
