name: iOS + watchOS → TestFlight

# Signs the iPhone app (with the Watch app inside) and uploads it to TestFlight.
# Needs an Apple Developer Program membership and these repository secrets
# (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID         App Store Connect API key ID     (Users and Access → Integrations → Keys)
#   ASC_ISSUER_ID      App Store Connect API issuer ID
#   ASC_KEY_P8         contents of the AuthKey_XXXX.p8 file
#   BUNDLE_PREFIX      e.g. hu.yourname  (app record in App Store Connect: <prefix>.toothbrushtimer)
on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_PREFIX: ${{ secrets.BUNDLE_PREFIX }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID BUNDLE_PREFIX; do [ -n "${!v}" ] || missing="$missing $v"; done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Hiányzó secret(ek):$missing (lásd ios/README.md)"; exit 1; fi

      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Generate project
        working-directory: ios
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (automatic signing via API key)
        working-directory: ios
        run: |
          xcodebuild -project ToothbrushTimer.xcodeproj -scheme ToothbrushTimer \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath build/ToothbrushTimer.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Upload to TestFlight
        working-directory: ios
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ToothbrushTimer.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Feltöltve. Kb. 10–30 perc múlva megjelenik a TestFlightban."
