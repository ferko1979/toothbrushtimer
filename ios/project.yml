# Xcode project definition (XcodeGen). Generate with ./bootstrap.sh
name: ToothbrushTimer
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: hu
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
packages:
  BrushCore:
    path: BrushCore
targets:
  ToothbrushTimer:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - LiveActivity
    dependencies:
      - package: BrushCore
      - target: ToothbrushTimerWatch
      - target: ToothbrushTimerWidgets
    entitlements:
      path: App/ToothbrushTimer.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fogmosás
        CFBundleDevelopmentRegion: hu
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "A fogmosás felismeréséhez figyeli a hangot (víz, súrolás, fogkefe zúgása). Hangfelvétel nem készül, minden a telefonon marad."
        NSFaceIDUsageDescription: "Az app és a szülői beállítások zárolásához, illetve a webes megosztás jóváhagyásához."
        NSCameraUsageDescription: "A weboldalon megjelenő QR-kód beolvasásához (Megnézem a weben). Kép nem készül."
        NSMotionUsageDescription: "Annak felismeréséhez, hogy a telefon le van-e téve, így a képernyő lezárása után is mérhet."
        NSHealthShareUsageDescription: "A fogmosások megjelenítéséhez az Egészség appban."
        NSHealthUpdateUsageDescription: "A fogmosások mentéséhez az Egészség appba (Fogmosás)."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.toothbrushtimer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ToothbrushTimerWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
      - WatchShared
    dependencies:
      - package: BrushCore
      - target: ToothbrushTimerWatchWidgets
    entitlements:
      path: Watch/ToothbrushTimerWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.${BUNDLE_PREFIX}.toothbrushtimer]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Fogmosás
        CFBundleDevelopmentRegion: hu
        WKApplication: true
        WKCompanionAppBundleIdentifier: ${BUNDLE_PREFIX}.toothbrushtimer
        WKBackgroundModes: [self-care]
        FogmosasAppGroup: group.${BUNDLE_PREFIX}.toothbrushtimer
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "A fogmosás felismeréséhez figyeli a hangot. Hangfelvétel nem készül."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.toothbrushtimer.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  # Live Activity on the lock screen and in the Dynamic Island.
  ToothbrushTimerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - LiveActivity
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Fogmosás
        CFBundleDevelopmentRegion: hu
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.toothbrushtimer.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # Watch face complication: today's brushings and streak.
  ToothbrushTimerWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
      - WatchShared
    entitlements:
      path: WatchWidgets/ToothbrushTimerWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.${BUNDLE_PREFIX}.toothbrushtimer]
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Fogmosás
        CFBundleDevelopmentRegion: hu
        FogmosasAppGroup: group.${BUNDLE_PREFIX}.toothbrushtimer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.toothbrushtimer.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

schemes:
  ToothbrushTimer:
    build:
      targets:
        ToothbrushTimer: all
        ToothbrushTimerWatch: all
    run:
      config: Debug
  ToothbrushTimerWatch:
    build:
      targets:
        ToothbrushTimerWatch: all
    run:
      config: Debug
