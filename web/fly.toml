# Fly.io: cd web && fly launch --copy-config --no-deploy && fly deploy
app = "fogmosas-web"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # One machine: the relay keeps messages in memory.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 500

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
