# /etc/nginx/sites-available/denthub-brush  (replace brush.example.hu with your subdomain)
# Then: ln -s ../sites-available/denthub-brush /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#       certbot --nginx -d brush.example.hu      (adds the https server block and renewal)
server {
    listen 80;
    listen [::]:80;
    server_name brush.example.hu;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser long-polls for up to 25 s while waiting for the phone.
        proxy_read_timeout 60s;
        proxy_buffering off;
        client_max_body_size 1m;
    }
}
