# DentHub-Brush web (dashboard + encrypted relay) on the metalquo server.
# The container listens only on localhost; nginx (or Caddy) in front of it serves the subdomain over https.
services:
  denthub-brush-web:
    build: ./web
    image: denthub-brush-web:latest
    container_name: denthub-brush-web
    restart: unless-stopped
    environment:
      - PORT=8080
    ports:
      - "127.0.0.1:${BRUSH_PORT:-8090}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
